name: Application checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      performance:
        description: Run disposable representative-data benchmark and query plans
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm recovery:self-check
      - run: pnpm build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: zenshin_test
          POSTGRES_DB: zenshin_test_runner
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenshin_test -d zenshin_test_runner"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      APP_ENV: development
      TEST_DATABASE_URL: postgresql://zenshin_test@localhost:5432/zenshin_test_runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      - name: Representative-data performance check
        if: github.event_name == 'workflow_dispatch' && inputs.performance
        run: pnpm perf:check
      - name: Record performance report and query plans
        if: always() && github.event_name == 'workflow_dispatch' && inputs.performance
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs";
            const path = "test-results/performance.json";
            console.log(existsSync(path) ? readFileSync(path, "utf8") : "No completed performance report; see setup/check failure.");
          '
