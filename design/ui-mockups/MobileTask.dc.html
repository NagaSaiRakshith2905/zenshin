<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile task</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m{width:390px;height:844px;display:flex;flex-direction:column;background:var(--background);overflow:hidden;position:relative;font-size:15px}
.m .props dt,.m .props dd{min-height:44px;height:44px}
.drawer{position:absolute;left:0;right:0;bottom:0;border-radius:24px 24px 0 0;border-bottom:0;padding:8px 8px 34px}
.grab{width:40px;height:5px;border-radius:3px;background:oklch(0.87 0.006 286.286);margin:2px auto 10px}
.opt{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:12px;width:100%;border:0;background:transparent;font:inherit;font-size:15px;color:var(--foreground);text-align:left}
.opt.on{background:oklch(0 0 0 / 5%);font-weight:500}
.opt .st{width:16px;height:16px}
</style>
</helmet>
<div class="m ui">
  <div class="row-flex" style="padding:52px 8px 8px">
    <a class="btn btn-g" href="MobileWork.dc.html" style="height:44px"><span class="ic ic-chev-l"></span>My work</a>
    <span class="grow"></span>
    <button class="btn btn-g btn-icon" style="width:44px;height:44px" aria-label="More actions"><span class="ic ic-more"></span></button>
  </div>
  <div style="padding:8px 16px 0">
    <div class="row-flex xs muted"><span class="mono">TRK-52</span><span class="ic s ic-chev-r"></span>TRK-50 Agent credentials and grants</div>
    <h1 class="title" style="margin-top:6px">Scope agent keys to project grants</h1>
    <button class="btn btn-o" style="height:44px;margin-top:14px"><span class="st ip" aria-hidden="true"></span>In progress<span class="ic s ic-chev-d"></span></button>
  </div>
  <div style="padding:12px 16px 0">
    <dl class="props" style="font-size:15px">
      <dt><span class="ic s ic-sort"></span>Priority</dt><dd>High</dd>
      <dt><span class="ic s ic-cal"></span>Due date</dt><dd>Nov 2</dd>
      <dt><span class="ic s ic-ban"></span>Blocked by</dt><dd class="mono" style="color:var(--foreground);font-size:13px">TRK-38</dd>
    </dl>
    <button class="btn btn-g muted" style="height:44px;margin-left:-12px"><span class="ic s ic-plus"></span>Add property</button>
  </div>
  <div class="overlay"></div>
  <div class="dlg drawer" role="dialog" aria-label="Change status">
    <div class="grab" aria-hidden="true"></div>
    <div style="padding:0 14px 6px;font-weight:600;font-size:16px">Change status</div>
    <button class="opt"><span class="st bk" aria-hidden="true"></span>Backlog</button>
    <button class="opt"><span class="st" aria-hidden="true"></span>Ready</button>
    <button class="opt on"><span class="st ip" aria-hidden="true"></span>In progress<span class="ic ic-check" style="margin-left:auto"></span></button>
    <button class="opt"><span class="st rv" aria-hidden="true"></span>In review</button>
    <button class="opt"><span class="st dn" aria-hidden="true"></span>Done</button>
    <button class="opt"><span class="st cn" aria-hidden="true"></span>Canceled</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
